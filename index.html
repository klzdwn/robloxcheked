<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-YUZAR CRASH | Roblox Checker</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --bg-color: #050505;
    --card-bg: rgba(15, 5, 5, 0.8);
    --neon-red: #ff1a1a;
    --neon-red-glow: rgba(255, 26, 26, 0.4);
    --neon-cyan: #00e5ff;
    --neon-cyan-glow: rgba(0, 229, 255, 0.3);
    --text-main: #e0e0e0;
    --text-muted: #888;
    --border-color: #331111;
  }

  body {
    background-color: var(--bg-color);
    background-image: 
      radial-gradient(circle at 50% 0%, rgba(255, 26, 26, 0.15) 0%, transparent 50%),
      radial-gradient(circle at 100% 100%, rgba(255, 26, 26, 0.1) 0%, transparent 50%);
    color: var(--text-main);
    font-family: 'Rajdhani', sans-serif;
    padding: 20px;
    min-height: 100vh;
  }

  .container { max-width: 800px; margin: 0 auto; }
  
  .header { text-align: center; margin-bottom: 30px; position: relative; }
  .header h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 2rem;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 4px;
    text-shadow: 0 0 10px var(--neon-red), 0 0 20px var(--neon-red);
    margin-bottom: 5px;
  }
  .header p {
    color: var(--neon-red);
    font-size: 0.8rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 700;
  }

  /* Efek Kaca & Nyala */
  .panel {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 15px rgba(0,0,0,0.8), inset 0 0 20px rgba(255, 26, 26, 0.05);
    position: relative;
    overflow: hidden;
  }
  
  /* Garis aksen atas */
  .panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--neon-red), transparent);
  }

  /* Input & Upload Area */
  .search-bar { display: flex; gap: 10px; margin-bottom: 20px; }
  .search-bar input { 
    flex: 1; 
    background: rgba(0,0,0,0.6); 
    border: 1px solid var(--border-color); 
    color: #fff; 
    padding: 14px 16px; 
    border-radius: 8px; 
    outline: none; 
    font-family: 'Rajdhani', sans-serif;
    font-size: 1rem;
    transition: 0.3s;
  }
  .search-bar input:focus { border-color: var(--neon-red); box-shadow: 0 0 10px var(--neon-red-glow); }

  .upload-area { text-align: center; display: flex; flex-direction: column; gap: 15px; align-items: center; }
  .upload-area input[type="file"] { display: none; }
  .upload-row { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
  
  .upload-btn { 
    background: transparent; 
    color: var(--neon-red); 
    border: 1px solid var(--neon-red); 
    padding: 10px 20px; 
    border-radius: 8px; 
    font-family: 'Orbitron', sans-serif;
    font-weight: bold;
    cursor: pointer; 
    transition: 0.3s;
    box-shadow: 0 0 10px transparent;
  }
  .upload-btn:hover { box-shadow: 0 0 15px var(--neon-red-glow); background: rgba(255, 26, 26, 0.1); }

  .limit-input { 
    width: 90px; padding: 10px; border-radius: 8px; 
    border: 1px solid var(--neon-cyan); background: rgba(0,0,0,0.8); 
    color: var(--neon-cyan); text-align: center; font-weight: bold; 
    font-family: 'Orbitron', sans-serif; box-shadow: 0 0 10px var(--neon-cyan-glow);
  }
  .upload-status { font-size: 0.9rem; color: var(--text-muted); }

  /* Stats Card */
  .stats-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  .badge-overview { 
    background: rgba(255, 26, 26, 0.1); border: 1px solid var(--neon-red);
    color: var(--neon-red); padding: 5px 12px; border-radius: 20px; 
    font-size: 0.75rem; font-weight: bold; letter-spacing: 1px;
  }
  .stats-title { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; letter-spacing: 1px; margin-bottom: 5px; }
  .stats-number { 
    font-family: 'Orbitron', sans-serif;
    font-size: 3rem; font-weight: 900; color: #fff; margin-bottom: 5px;
    text-shadow: 0 0 10px rgba(255,255,255,0.3);
  }
  .stats-desc { font-size: 0.85rem; color: var(--text-muted); }

  /* Status Row */
  .filter-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; font-size: 0.95rem; }
  .status-badge { 
    background: rgba(0, 229, 255, 0.1); border: 1px solid var(--neon-cyan);
    color: var(--neon-cyan); padding: 5px 12px; border-radius: 6px; 
    font-size: 0.8rem; font-weight: bold; letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Account Cards */
  .account-card { 
    background: var(--card-bg); 
    border: 1px solid var(--border-color); 
    border-left: 4px solid var(--neon-red); 
    border-radius: 12px; 
    padding: 20px; 
    display: flex; gap: 20px; 
    margin-bottom: 16px;
    backdrop-filter: blur(5px);
    transition: 0.3s;
  }
  .account-card:hover { box-shadow: 0 0 20px var(--neon-red-glow); transform: translateY(-2px); }

  .avatar-box { 
    width: 80px; height: 100px; background: #000; 
    border-radius: 8px; border: 1px solid var(--border-color);
    display: flex; align-items: center; justify-content: center; 
    overflow: hidden; flex-shrink: 0; 
  }
  .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
  
  .acc-info { flex: 1; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
  .acc-name { 
    font-family: 'Orbitron', sans-serif;
    font-size: 1.1rem; font-weight: bold; color: #fff; margin-bottom: 4px; 
    text-transform: uppercase; letter-spacing: 1px;
  }
  .acc-username { font-size: 0.9rem; color: var(--neon-red); margin-bottom: 12px; font-weight: 700; }
  .acc-details { display: flex; gap: 15px; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px; flex-wrap: wrap; }
  .acc-details span { display: flex; align-items: center; gap: 5px; }
  
  .acc-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn-action { 
    padding: 10px 16px; border-radius: 6px; font-size: 0.85rem; 
    font-weight: bold; cursor: pointer; border: none; 
    display: flex; align-items: center; justify-content: center; gap: 6px; 
    font-family: 'Orbitron', sans-serif;
    transition: 0.3s;
  }
  
  .btn-usn { 
    background: rgba(0, 229, 255, 0.1); color: var(--neon-cyan); 
    border: 1px solid var(--neon-cyan); flex: 1; 
  }
  .btn-usn:hover { background: var(--neon-cyan); color: #000; box-shadow: 0 0 10px var(--neon-cyan-glow); }
  
  .btn-pw { 
    background: rgba(255, 26, 26, 0.1); color: var(--neon-red); 
    border: 1px solid var(--neon-red); flex: 1; 
  }
  .btn-pw:hover { background: var(--neon-red); color: #fff; box-shadow: 0 0 10px var(--neon-red-glow); }

  .loading-text { text-align: center; color: var(--neon-red); padding: 20px; font-size: 1rem; letter-spacing: 2px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>X-YUZAR</h1>
    <p>Roblox Account Checker</p>
  </div>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Pencarian username / IP...">
  </div>

  <div class="panel">
    <div class="upload-area">
      <div class="upload-row">
        <label for="fileInput" class="upload-btn">📁 UPLOAD FILE .TXT</label>
        <div style="color:var(--text-muted); font-size:0.9rem;">CEK MAX:</div>
        <input type="number" id="limitInput" class="limit-input" value="1500" min="1">
        <div style="color:var(--text-muted); font-size:0.9rem;">AKUN</div>
      </div>
      <input type="file" id="fileInput" accept=".txt">
      <div class="upload-status" id="uploadStatus">Format: username:password:ip (satu baris satu akun)</div>
    </div>
  </div>

  <div class="panel">
    <div class="stats-top">
      <span class="badge-overview">📈 OVERVIEW</span>
    </div>
    <div class="stats-title">TOTAL AKUN DI FILE</div>
    <div class="stats-number" id="totalAkun">0</div>
    <div class="stats-desc" id="statsDesc">0 dicek · 0 belum · 0 not found · 0 private</div>
  </div>

  <div class="panel" style="padding: 5px;">
    <div class="filter-row">
      <span>🔄 Status Pengecekan</span>
      <span class="status-badge" id="statusCek">Idle</span>
    </div>
  </div>

  <div id="accountList">
    <div class="loading-text" id="emptyState">// SYSTEM STANDBY // MENUNGGU FILE .TXT //</div>
  </div>

</div>

<script>
  const SCRAPINGBEE_API_KEY = "B0ZXSIG1CIC2FOF5S4ZRCK3LV3GRPRT3LCZMVDR7L12EOCOBUXCCUNVI48GLWX6ABXG5S0SZRUV1UMA8"; 
  const SCRAPINGBEE_URL = "https://app.scrapingbee.com/api/v1/";

  let accountsData = [];

  function renderCard(data) {
    const list = document.getElementById('accountList');
    const card = document.createElement('div');
    card.className = 'account-card';
    card.innerHTML = `
      <div class="avatar-box">
        <img src="${data.avatar || 'https://tr.rbxcdn.com/30DAY-AvatarHeadshot-F7B3D3C633D41D48F665A26B272E9B97-Png/150/150/AvatarHeadshot/Webp/noFilter'}" alt="Avatar" onerror="this.src='https://tr.rbxcdn.com/30DAY-AvatarHeadshot-F7B3D3C633D41D48F665A26B272E9B97-Png/150/150/AvatarHeadshot/Webp/noFilter'">
      </div>
      <div class="acc-info">
        <div class="acc-name">${data.displayName || 'UNKNOWN'}</div>
        <div class="acc-username">@${data.username || 'unknown'}</div>
        <div class="acc-details">
          <span>📍 ${data.country || 'Unknown'}</span>
          <span>🌐 ${data.ip || '0.0.0.0'}</span>
        </div>
        <div class="acc-actions">
          <button class="btn-action btn-usn" onclick="navigator.clipboard.writeText('${data.username}'); alert('Username dicopy!')">📋 USN</button>
          <button class="btn-action btn-pw" onclick="navigator.clipboard.writeText('${data.password || ''}'); alert('Password dicopy!')">🔑 PW</button>
        </div>
      </div>
    `;
    list.appendChild(card);
  }

  async function fetchRobloxData(username) {
    try {
      const robloxUrl = encodeURIComponent('https://users.roblox.com/v1/usernames/users');
      
      const resId = await fetch(`${SCRAPINGBEE_URL}?api_key=${SCRAPINGBEE_API_KEY}&url=${robloxUrl}&render_js=false`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usernames: [username], excludeBannedUsers: false })
      });
      
      const textData = await resId.text();
      let dataId;
      
      try {
        dataId = JSON.parse(textData);
      } catch (e) {
        throw new Error("Limit ScrapingBee habis atau API Key salah.");
      }

      if (!dataId.data || dataId.data.length === 0) {
        return { username, displayName: 'Not Found', avatar: null, status: 'not_found' };
      }

      const userId = dataId.data[0].id;
      const displayName = dataId.data[0].displayName;

      const avatarUrlTarget = encodeURIComponent('https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=' + userId + '&size=150x150&format=Png&isCircular=false');
      
      const resAvatar = await fetch(`${SCRAPINGBEE_URL}?api_key=${SCRAPINGBEE_API_KEY}&url=${avatarUrlTarget}&render_js=false`);
      const dataAvatar = await resAvatar.json();
      const avatarUrl = dataAvatar.data && dataAvatar.data[0] ? dataAvatar.data[0].imageUrl : null;

      return { username, displayName, avatar: avatarUrl, status: 'success' };

    } catch (err) {
      return { username, displayName: 'Error System', avatar: null, status: 'error' };
    }
  }

  document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = async function(e) {
      const content = e.target.result;
      const lines = content.split('\n').filter(line => line.trim() !== '');
      
      accountsData = lines.map(line => {
        const parts = line.split(':');
        return {
          username: parts[0] ? parts[0].trim() : 'Unknown',
          password: parts[1] ? parts[1].trim() : '',
          ip: parts[2] ? parts[2].trim() : ''
        };
      });

      document.getElementById('totalAkun').innerText = accountsData.length;
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('statusCek').innerText = "PROCESSING...";
      
      const list = document.getElementById('accountList');
      list.innerHTML = '<div class="loading-text">// MENARIK DATA DARI SERVER //</div>';

      let processedCount = 0;
      let notFoundCount = 0;

      const limitCek = parseInt(document.getElementById('limitInput').value) || 1500;
      const batasAkhir = Math.min(accountsData.length, limitCek);

      document.getElementById('uploadStatus').innerText = `Memproses ${batasAkhir} akun...`;

      for (let i = 0; i < batasAkhir; i++) {
        const acc = accountsData[i];
        await new Promise(r => setTimeout(r, 1500)); 
        
        const result = await fetchRobloxData(acc.username);
        const mergedData = { ...acc, ...result };
        
        if (i === 0) list.innerHTML = ''; 
        renderCard(mergedData);

        if (result.status === 'not_found') notFoundCount++;
        processedCount++;

        document.getElementById('statusCek').innerText = `CHECKING ${processedCount}/${batasAkhir}`;
        document.getElementById('statsDesc').innerText = `${processedCount} dicek · ${batasAkhir - processedCount} belum · ${notFoundCount} not found · 0 private`;
      }

      document.getElementById('statusCek').innerText = "COMPLETED";
      document.getElementById('uploadStatus').innerText = `Selesai memproses ${processedCount} akun.`;
    };
    reader.readAsText(file);
  });
  
  // Fitur Search
  document.getElementById('searchInput').addEventListener('input', function(e) {
    const query = e.target.value.toLowerCase();
    const cards = document.querySelectorAll('.account-card');
    
    cards.forEach(card => {
      const text = card.innerText.toLowerCase();
      if (text.includes(query)) {
        card.style.display = 'flex';
      } else {
        card.style.display = 'none';
      }
    });
  });
</script>
</body>
</html>
