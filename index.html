<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dakzz Nontrue Checker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
  body { background: #0a0a0c; color: #e0e0e0; padding: 20px; }
  .container { max-width: 800px; margin: 0 auto; }
  
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo { background: #1e3a2f; color: #4ade80; padding: 10px; border-radius: 12px; font-weight: bold; font-size: 1.2rem; }
  .title h1 { font-size: 1.2rem; color: #fff; }
  .title span { font-size: 0.8rem; color: #888; }
  .header-right { display: flex; gap: 8px; }
  .btn-header { background: #1a1a1a; border: 1px solid #333; color: #ccc; padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; }
  .btn-synced { border-color: #166534; color: #4ade80; background: #052e16; }

  .search-bar { display: flex; gap: 10px; margin-bottom: 20px; }
  .search-bar input { flex: 1; background: #141414; border: 1px solid #333; color: #fff; padding: 14px 16px; border-radius: 12px; outline: none; font-size: 0.95rem; }
  .search-bar button { background: #1a1a1a; border: 1px solid #333; color: #ccc; padding: 14px; border-radius: 12px; cursor: pointer; }

  .upload-area { background: #141414; border: 1px dashed #444; border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 20px; }
  .upload-area input[type="file"] { display: none; }
  .upload-btn { background: #fff; color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
  .upload-status { font-size: 0.85rem; color: #888; margin-top: 10px; }

  .stats-card { background: linear-gradient(145deg, #14141a, #0d0d12); border: 1px solid #2a2a35; border-radius: 20px; padding: 24px; margin-bottom: 20px; }
  .stats-top { display: flex; justify-content: space-between; margin-bottom: 16px; }
  .badge-overview { background: #2e1a47; color: #c084fc; padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
  .stats-title { font-size: 0.85rem; color: #888; font-weight: 600; letter-spacing: 1px; margin-bottom: 8px; }
  .stats-number { font-size: 3rem; font-weight: bold; color: #fff; margin-bottom: 8px; }
  .stats-desc { font-size: 0.85rem; color: #666; }

  .filter-row { display: flex; justify-content: space-between; align-items: center; background: #141414; border: 1px solid #222; padding: 16px; border-radius: 12px; margin-bottom: 12px; font-size: 0.9rem; color: #aaa; cursor: pointer; }

  .chips { display: flex; gap: 8px; margin-bottom: 20px; }
  .chip { background: #052e16; border: 1px solid #166534; color: #4ade80; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; display: flex; align-items: center; gap: 6px; }
  .chip span { cursor: pointer; }

  .account-card { background: #141414; border: 1px solid #222; border-radius: 16px; padding: 20px; display: flex; gap: 20px; margin-bottom: 16px; }
  .avatar-box { width: 80px; height: 100px; background: #1a1a1a; border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
  .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
  .acc-info { flex: 1; overflow: hidden; }
  .acc-name { font-size: 1.1rem; font-weight: bold; color: #fff; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acc-username { font-size: 0.85rem; color: #888; margin-bottom: 12px; }
  .acc-details { display: flex; gap: 16px; font-size: 0.8rem; color: #aaa; margin-bottom: 16px; flex-wrap: wrap; }
  .acc-details span { display: flex; align-items: center; gap: 4px; }
  
  .acc-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn-action { padding: 10px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: bold; cursor: pointer; border: none; display: flex; align-items: center; gap: 6px; }
  .btn-usn { background: #10b981; color: #fff; flex: 1; justify-content: center; }
  .btn-pw { background: #064e3b; color: #34d399; flex: 1; justify-content: center; border: 1px solid #065f46; }
  .btn-mail { background: #10b981; color: #fff; padding: 6px 12px; font-size: 0.75rem; border-radius: 6px; }
  .btn-loc { background: #1e1b4b; color: #818cf8; padding: 6px 12px; font-size: 0.75rem; border-radius: 6px; border: 1px solid #3730a3; }
  .loading-text { text-align: center; color: #888; padding: 20px; font-size: 0.9rem; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-left">
      <div class="logo">📦</div>
      <div class="title">
        <h1>Dakzz Nontrue</h1>
        <span>WEB</span>
      </div>
    </div>
    <div class="header-right">
      <button class="btn-header">👤 Guest</button>
      <button class="btn-header btn-synced">Synced</button>
    </div>
  </div>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Cari username, IP, item...">
  </div>

  <div class="upload-area">
    <label for="fileInput" class="upload-btn">📁 Pilih File .txt</label>
    <input type="file" id="fileInput" accept=".txt">
    <div class="upload-status" id="uploadStatus">Format: user:pass:ip (satu baris satu akun)</div>
  </div>

  <div class="stats-card">
    <div class="stats-top">
      <span class="badge-overview">📈 OVERVIEW</span>
    </div>
    <div class="stats-title">TOTAL AKUN</div>
    <div class="stats-number" id="totalAkun">0</div>
    <div class="stats-desc" id="statsDesc">0 dicek · 0 belum · 0 not found · 0 private</div>
  </div>

  <div class="filter-row" style="cursor: default;">
    <span>🔄 Status Pengecekan</span>
    <span class="badge" id="statusCek" style="background: #1f1f24; color: #ddd; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem;">Idle</span>
  </div>

  <div class="chips">
    <div class="chip">Dengan avatar <span>×</span></div>
  </div>

  <div id="accountList">
    <div class="loading-text" id="emptyState">Belum ada data. Silakan upload file .txt dulu.</div>
  </div>

</div>

<script>
  // ==========================================
  // GANTI URL INI PAKE URL CLOUDFLARE WORKER LO
  // ==========================================
  const WORKER_URL = "https://GANTI_PAKE_URL_WORKER_LO.workers.dev"; 

  let accountsData = [];
  let filteredData = [];

  // Format angka
  function formatNumber(n) {
    return new Intl.NumberFormat('id-ID').format(n);
  }

  // Fungsi buat render kartu
  function renderCard(data, index) {
    const list = document.getElementById('accountList');
    const card = document.createElement('div');
    card.className = 'account-card';
    card.innerHTML = `
      <div class="avatar-box">
        <img src="${data.avatar || 'https://tr.rbxcdn.com/30DAY-AvatarHeadshot-F7B3D3C633D41D48F665A26B272E9B97-Png/150/150/AvatarHeadshot/Webp/noFilter'}" alt="Avatar" onerror="this.src='https://tr.rbxcdn.com/30DAY-AvatarHeadshot-F7B3D3C633D41D48F665A26B272E9B97-Png/150/150/AvatarHeadshot/Webp/noFilter'">
      </div>
      <div class="acc-info">
        <div class="acc-name">${data.displayName || 'UNKNOWN'}</div>
        <div class="acc-username">@${data.username || 'unknown'}</div>
        <div class="acc-details">
          <span>📍 ${data.country || 'Unknown'}</span>
          <span>🌐 ${data.ip || '0.0.0.0'}</span>
        </div>
        <div class="acc-actions">
          <button class="btn-loc" onclick="alert('Fitur lokasi belum tersedia')">📍 Lokasi ⌄</button>
          <button class="btn-mail" onclick="alert('Fitur mail belum tersedia')">MAIL</button>
        </div>
        <div class="acc-actions" style="margin-top:10px;">
          <button class="btn-action btn-usn" onclick="navigator.clipboard.writeText('${data.username}'); alert('Username dicopy!')">📋 USN</button>
          <button class="btn-action btn-pw" onclick="navigator.clipboard.writeText('${data.password || ''}'); alert('Password dicopy!')">🔑 PW</button>
        </div>
      </div>
    `;
    list.appendChild(card);
  }

  // Fungsi nembak API Roblox lewat Worker
  async function fetchRobloxData(username) {
    try {
      // 1. Cari ID berdasarkan Username
      const resId = await fetch(`${WORKER_URL}/?url=${encodeURIComponent('https://users.roblox.com/v1/usernames/users')}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usernames: [username], excludeBannedUsers: false })
      });
      
      const dataId = await resId.json();
      
      if (!dataId.data || dataId.data.length === 0) {
        return { username, displayName: 'Not Found', avatar: null, status: 'not_found' };
      }

      const userId = dataId.data[0].id;
      const displayName = dataId.data[0].displayName;

      // 2. Ambil Avatar
      const resAvatar = await fetch(`${WORKER_URL}/?url=${encodeURIComponent('https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=' + userId + '&size=150x150&format=Png&isCircular=false')}`);
      const dataAvatar = await resAvatar.json();
      const avatarUrl = dataAvatar.data && dataAvatar.data[0] ? dataAvatar.data[0].imageUrl : null;

      return { username, displayName, avatar: avatarUrl, status: 'success' };

    } catch (err) {
      console.error("Error fetch:", username, err);
      return { username, displayName: 'Error', avatar: null, status: 'error' };
    }
  }

  // Proses file txt
  document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = async function(e) {
      const content = e.target.result;
      const lines = content.split('\n').filter(line => line.trim() !== '');
      
      accountsData = lines.map(line => {
        const parts = line.split(':');
        return {
          username: parts[0] ? parts[0].trim() : 'Unknown',
          password: parts[1] ? parts[1].trim() : '',
          ip: parts[2] ? parts[2].trim() : ''
        };
      });

      document.getElementById('totalAkun').innerText = accountsData.length;
      document.getElementById('uploadStatus').innerText = `Berhasil load ${accountsData.length} akun. Mulai ngecek...`;
      document.getElementById('statusCek').innerText = "Checking...";
      document.getElementById('emptyState').style.display = 'none';
      
      const list = document.getElementById('accountList');
      list.innerHTML = '<div class="loading-text">Sedang narik data dari Roblox (mungkin butuh waktu beberapa menit)...</div>';

      // Proses satu per satu biar ga kena rate limit parah
      let processedCount = 0;
      let successCount = 0;
      let notFoundCount = 0;

      for (let i = 0; i < accountsData.length; i++) {
        const acc = accountsData[i];
        
        // Delay 1 detik tiap request biar aman
        await new Promise(r => setTimeout(r, 1000));
        
        const result = await fetchRobloxData(acc.username);
        
        if (result.status === 'success') successCount++;
        if (result.status === 'not_found') notFoundCount++;

        const mergedData = { ...acc, ...result };
        
        if (i === 0) list.innerHTML = ''; // Hapus loading text di awal
        renderCard(mergedData, i);

        processedCount++;
        document.getElementById('statusCek').innerText = `Checking ${processedCount}/${accountsData.length}`;
        document.getElementById('statsDesc').innerText = `${processedCount} dicek · ${accountsData.length - processedCount} belum · ${notFoundCount} not found · 0 private`;
      }

      document.getElementById('statusCek').innerText = "Selesai";
      document.getElementById('uploadStatus').innerText = `Selesai ngecek ${accountsData.length} akun.`;
    };
    reader.readAsText(file);
  });

  // Fitur Search
  document.getElementById('searchInput').addEventListener('input', function(e) {
    const query = e.target.value.toLowerCase();
    const cards = document.querySelectorAll('.account-card');
    
    cards.forEach(card => {
      const text = card.innerText.toLowerCase();
      if (text.includes(query)) {
        card.style.display = 'flex';
      } else {
        card.style.display = 'none';
      }
    });
  });
</script>
</body>
</html>
